<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="900" fill="#0E131F"/>
  
  <!-- Browser Chrome Header -->
  <rect width="1280" height="50" fill="#171E2E"/>
  <circle cx="25" cy="25" r="6" fill="#EF4444"/>
  <circle cx="45" cy="25" r="6" fill="#F59E0B"/>
  <circle cx="65" cy="25" r="6" fill="#10B981"/>
  <rect x="160" y="10" width="680" height="30" rx="15" fill="#222C42"/>
  <text x="180" y="30" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">https://study-materialchatbot.netlify.app</text>

  <!-- App Header -->
  <rect y="50" width="1280" height="70" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
  <text x="50" y="93" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700">📚 Study Material Chatbot</text>
  <text x="320" y="93" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14">Instant Academic Notes &amp; Query Retrieval for Students</text>
  <rect x="1100" y="65" width="130" height="40" rx="8" fill="#0284C7"/>
  <text x="1165" y="90" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Online Portal</text>

  <!-- Main Content Layout -->
  <g transform="translate(50, 160)">
    <!-- Sidebar / Subjects -->
    <rect width="280" height="680" rx="16" fill="#131C30" stroke="#1E2A42" stroke-width="1"/>
    <text x="24" y="40" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">SUBJECT MODULES</text>
    
    <rect x="16" y="60" width="248" height="48" rx="8" fill="#1E293B"/>
    <text x="32" y="90" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600">📘 C Programming</text>

    <rect x="16" y="118" width="248" height="48" rx="8" fill="#162035"/>
    <text x="32" y="148" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14">📗 Data Structures</text>

    <rect x="16" y="176" width="248" height="48" rx="8" fill="#162035"/>
    <text x="32" y="206" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14">📙 Java Programming</text>

    <rect x="16" y="234" width="248" height="48" rx="8" fill="#162035"/>
    <text x="32" y="264" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14">📕 Version Control (Git)</text>

    <!-- Chat Interface -->
    <rect x="310" width="870" height="680" rx="16" fill="#131C30" stroke="#1E2A42" stroke-width="1"/>
    
    <!-- User Message -->
    <rect x="580" y="40" width="560" height="60" rx="14" fill="#0284C7"/>
    <text x="600" y="76" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15">"Can you explain pointers and memory management in C?"</text>

    <!-- Chatbot Response -->
    <rect x="340" y="120" width="700" height="260" rx="14" fill="#1A243B" stroke="#2B3A59" stroke-width="1"/>
    <text x="364" y="156" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700">Study Material Assistant:</text>
    <text x="364" y="194" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15">Pointers in C are variables that store the memory address of another variable.</text>
    <text x="364" y="228" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14">• Declaration: int *ptr = &amp;val;</text>
    <text x="364" y="258" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14">• Dynamic Memory: malloc(), calloc(), free() in stdlib.h</text>
    <text x="364" y="288" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14">• Always free allocated memory to prevent memory leaks in embedded/systems tasks.</text>
    <text x="364" y="340" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600">✓ Source: SSGMCE Computer Science Engineering Courseware</text>

    <!-- Query Input Area -->
    <rect x="340" y="580" width="810" height="60" rx="12" fill="#0B111E" stroke="#334155" stroke-width="1"/>
    <text x="364" y="616" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15">Type your query or topic name to find study material...</text>
    <rect x="1030" y="590" width="100" height="40" rx="8" fill="#0284C7"/>
    <text x="1080" y="615" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Ask ↵</text>
  </g>
</svg>
