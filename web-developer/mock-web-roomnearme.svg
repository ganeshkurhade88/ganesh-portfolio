<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="900" fill="#0A0F1D"/>
  
  <!-- Browser Chrome Header -->
  <rect width="1280" height="50" fill="#131B2E"/>
  <circle cx="25" cy="25" r="6" fill="#EF4444"/>
  <circle cx="45" cy="25" r="6" fill="#F59E0B"/>
  <circle cx="65" cy="25" r="6" fill="#10B981"/>
  <rect x="160" y="10" width="680" height="30" rx="15" fill="#1E2A45"/>
  <text x="180" y="30" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">https://roomnearme.ai.studio</text>

  <!-- App Header -->
  <rect y="50" width="1280" height="70" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="50" y="93" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700">📍 Room Near Me</text>
  <text x="240" y="93" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14">Platform to search for and locate nearby rooms and student accommodation</text>
  <rect x="1100" y="65" width="130" height="40" rx="8" fill="#0284C7"/>
  <text x="1165" y="90" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Live Platform</text>

  <!-- Search & Accommodation Grid -->
  <g transform="translate(50, 150)">
    <!-- Search Bar -->
    <rect width="1180" height="56" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="24" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15">Search by college gate, area, or budget...</text>
    <rect x="1050" y="8" width="110" height="40" rx="8" fill="#0284C7"/>
    <text x="1105" y="33" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Search</text>

    <!-- Room Listings -->
    <g transform="translate(0, 80)">
      <!-- Listing 1 -->
      <rect width="370" height="420" rx="16" fill="#131D33" stroke="#2563EB" stroke-width="1.5"/>
      <rect width="370" height="180" rx="16" fill="#1E293B"/>
      <text x="185" y="100" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" text-anchor="middle">🏠 Room Photo</text>
      <rect x="16" y="16" width="90" height="26" rx="6" fill="#0284C7"/>
      <text x="61" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">VERIFIED</text>
      
      <text x="24" y="220" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700">Single Bed Student Room</text>
      <text x="24" y="250" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">📍 300m from College Gate</text>
      <text x="24" y="290" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700">₹3,200 / mo</text>
      <rect x="24" y="340" width="322" height="44" rx="8" fill="#0284C7"/>
      <text x="185" y="367" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">View Accommodation</text>

      <!-- Listing 2 -->
      <g transform="translate(405, 0)">
        <rect width="370" height="420" rx="16" fill="#131D33" stroke="#334155" stroke-width="1.5"/>
        <rect width="370" height="180" rx="16" fill="#1E293B"/>
        <text x="185" y="100" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" text-anchor="middle">🏢 Shared Room</text>
        <rect x="16" y="16" width="90" height="26" rx="6" fill="#10B981"/>
        <text x="61" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">POPULAR</text>

        <text x="24" y="220" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700">2-Bed Shared Room</text>
        <text x="24" y="250" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">📍 500m walking distance</text>
        <text x="24" y="290" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700">₹2,500 / mo</text>
        <rect x="24" y="340" width="322" height="44" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
        <text x="185" y="367" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">View Accommodation</text>
      </g>

      <!-- Listing 3 -->
      <g transform="translate(810, 0)">
        <rect width="370" height="420" rx="16" fill="#131D33" stroke="#334155" stroke-width="1.5"/>
        <rect width="370" height="180" rx="16" fill="#1E293B"/>
        <text x="185" y="100" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" text-anchor="middle">🏡 Studio Flat</text>
        
        <text x="24" y="220" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700">Private Studio Accommodation</text>
        <text x="24" y="250" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">📍 800m to college campus</text>
        <text x="24" y="290" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700">₹4,000 / mo</text>
        <rect x="24" y="340" width="322" height="44" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
        <text x="185" y="367" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">View Accommodation</text>
      </g>
    </g>
  </g>
</svg>
