<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" rx="28" fill="url(#droneGrad)"/>
  <!-- Quadcopter Arms -->
  <line x1="36" y1="36" x2="92" y2="92" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="92" y1="36" x2="36" y2="92" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- Center Body -->
  <rect x="52" y="52" width="24" height="24" rx="6" fill="#38BDF8"/>
  <!-- 4 Motors -->
  <circle cx="36" cy="36" r="10" fill="#38BDF8"/>
  <circle cx="92" cy="36" r="10" fill="#38BDF8"/>
  <circle cx="36" cy="92" r="10" fill="#38BDF8"/>
  <circle cx="92" cy="92" r="10" fill="#38BDF8"/>
  <defs>
    <linearGradient id="droneGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0F172A"/>
