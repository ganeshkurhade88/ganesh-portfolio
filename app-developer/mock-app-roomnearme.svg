    <rect width="372" height="240" rx="16" fill="#131D33" stroke="#2563EB" stroke-width="1.5"/>
    <rect width="372" height="110" rx="16" fill="#1E293B"/>
    <text x="186" y="65" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" text-anchor="middle">🏠 Campus View Room</text>
