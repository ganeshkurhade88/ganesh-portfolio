<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="860" viewBox="0 0 420 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="420" height="860" rx="36" fill="#0A0F1D"/>
  
  <!-- Dynamic Island -->
  <rect x="150" y="16" width="120" height="30" rx="15" fill="#000000"/>

  <!-- App Header -->
  <g transform="translate(24, 70)">
    <text x="0" y="28" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="800">Room Near Me</text>
    <text x="0" y="52" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">Nearby Student Accommodation</text>
    <circle cx="340" cy="30" r="18" fill="#1E293B"/>
    <text x="340" y="36" font-size="16" text-anchor="middle">🔍</text>
  </g>

  <!-- Filter Chips -->
  <g transform="translate(24, 140)">
    <rect width="100" height="32" rx="16" fill="#0284C7"/>
    <text x="50" y="21" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">&lt; 500m</text>

    <rect x="108" width="110" height="32" rx="16" fill="#1E293B"/>
    <text x="163" y="21" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Single Bed</text>

    <rect x="226" width="120" height="32" rx="16" fill="#1E293B"/>
