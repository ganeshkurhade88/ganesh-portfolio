      <rect x="240" y="174" width="116" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <text x="298" y="197" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">View Room →</text>
