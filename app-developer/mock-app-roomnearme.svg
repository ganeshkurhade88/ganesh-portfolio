    <rect x="240" y="174" width="116" height="36" rx="8" fill="#2563EB"/>
    <text x="298" y="197" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">View Room →</text>

    <!-- Card 2 -->
    <g transform="translate(0, 255)">
      <rect width="372" height="240" rx="16" fill="#131D33" stroke="#334155" stroke-width="1.5"/>
      <rect width="372" height="110" rx="16" fill="#1E293B"/>
      <text x="186" y="65" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" text-anchor="middle">🏢 Shared Apartment</text>
      <rect x="14" y="14" width="80" height="22" rx="4" fill="#10B981"/>
      <text x="54" y="29" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">POPULAR</text>

      <text x="18" y="142" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700">2-Sharing Student Flat</text>
      <text x="18" y="164" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12">📍 600m to Library · Shegaon</text>
