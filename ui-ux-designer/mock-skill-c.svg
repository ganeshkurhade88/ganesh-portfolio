      <text x="60" y="30"><tspan fill="#F43F5E">#include</tspan> <tspan fill="#34D399">&lt;stdio.h&gt;</tspan></text>
      <text x="60" y="55"><tspan fill="#F43F5E">#include</tspan> <tspan fill="#34D399">&lt;stdlib.h&gt;</tspan></text>
      <text x="60" y="80"><tspan fill="#64748B">// Verified C Skill — Ganesh Balu Kurhade (SSGMCE Shegaon)</tspan></text>
      <text x="60" y="105"><tspan fill="#F43F5E">typedef struct</tspan> <tspan fill="#E2E8F0">RecordNode {</tspan></text>
      <text x="60" y="130">    <tspan fill="#38BDF8">int</tspan> <tspan fill="#E2E8F0">component_id;</tspan></text>
      <text x="60" y="155">    <tspan fill="#38BDF8">double</tspan> <tspan fill="#E2E8F0">telemetry_value;</tspan></text>
      <text x="60" y="180">    <tspan fill="#F43F5E">struct</tspan> <tspan fill="#E2E8F0">RecordNode* next;</tspan></text>
      <text x="60" y="205"><tspan fill="#E2E8F0">} Node;</tspan></text>
      <text x="60" y="230"></text>
      <text x="60" y="255"><tspan fill="#38BDF8">Node*</tspan> <tspan fill="#A78BFA">allocate_node</tspan><tspan fill="#E2E8F0">(</tspan><tspan fill="#38BDF8">int</tspan> <tspan fill="#E2E8F0">id,</tspan> <tspan fill="#38BDF8">double</tspan> <tspan fill="#E2E8F0">val) {</tspan></text>
      <text x="60" y="280">    <tspan fill="#38BDF8">Node*</tspan> <tspan fill="#E2E8F0">n = (</tspan><tspan fill="#38BDF8">Node*</tspan><tspan fill="#E2E8F0">)malloc(</tspan><tspan fill="#F43F5E">sizeof</tspan><tspan fill="#E2E8F0">(</tspan><tspan fill="#38BDF8">Node</tspan><tspan fill="#E2E8F0">));</tspan></text>
      <text x="60" y="305">    <tspan fill="#F43F5E">if</tspan> <tspan fill="#E2E8F0">(!n) { fprintf(stderr, </tspan><tspan fill="#34D399">"Memory allocation failed
"</tspan><tspan fill="#E2E8F0">); exit(1); }</tspan></text>
      <text x="60" y="330">    <tspan fill="#E2E8F0">n-&gt;component_id = id; n-&gt;telemetry_value = val; n-&gt;next = NULL;</tspan></text>
      <text x="60" y="355">    <tspan fill="#F43F5E">return</tspan> <tspan fill="#E2E8F0">n;</tspan></text>
      <text x="60" y="380"><tspan fill="#E2E8F0">}</tspan></text>
      <text x="60" y="405"></text>
      <text x="60" y="430"><tspan fill="#38BDF8">int</tspan> <tspan fill="#A78BFA">main</tspan><tspan fill="#E2E8F0">(</tspan><tspan fill="#38BDF8">void</tspan><tspan fill="#E2E8F0">) {</tspan></text>
      <text x="60" y="455">    <tspan fill="#38BDF8">Node*</tspan> <tspan fill="#E2E8F0">head = allocate_node(101, 8.18);</tspan></text>
